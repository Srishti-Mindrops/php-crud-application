name: PHP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ci-cd-setup
  pull_request:
    branches:
      - main

jobs:
  php-syntax-check:
    name: PHP Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/php --error

  deploy:
    name: Deploy to EC2
    needs:
      - php-syntax-check
      - semgrep-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd-setup'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy application to EC2 staging directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$EC2_USER@$EC2_HOST:/home/$EC2_USER/php-crud-deploy/"

      - name: Deploy application to Apache
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo rsync -a --delete --exclude='.env' --chown=root:root /home/$EC2_USER/php-crud-deploy/ /var/www/php-crud-application/ && test -f /var/www/php-crud-application/.env && curl -fsS http://localhost/ >/dev/null && echo 'Deployment successful'"
