name: PHP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ci-cd-setup
  pull_request:
    branches:
      - main

jobs:
  php-syntax-check:
    name: PHP Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/php --error

  deploy:
    name: Deploy to EC2
    needs:
      - php-syntax-check
      - semgrep-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd-setup'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Validate SSH Private Key
        run: |
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub
          ssh-keygen -lf /tmp/deploy_key.pub

      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            'whoami && echo "SSH connection successful"'

      - name: Deploy using Git
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            '
              set -e

              REPO_URL="https://github.com/Srishti-Mindrops/php-crud-application.git"
              APP_DIR="/home/ec2-user/php-crud-application"
              WEB_DIR="/var/www/php-crud-application"
              BRANCH="ci-cd-setup"

              if [ -d "$APP_DIR/.git" ]; then
                echo "Updating existing Git repository..."
                git -C "$APP_DIR" fetch origin
                git -C "$APP_DIR" reset --hard "origin/$BRANCH"
              else
                echo "Cloning repository..."
                git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
              fi

              echo "Deploying application files..."
              git -C "$APP_DIR" archive HEAD | sudo tar --exclude=.env -xf - -C "$WEB_DIR"

              echo "Checking environment file..."
              test -f "$WEB_DIR/.env"

              echo "Checking Apache..."
              sudo systemctl is-active --quiet httpd

              curl -fsS http://localhost/ >/dev/null

              echo "Deployment successful!"
            '
